[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ez-money"
version = "0.1.0"
description = "Buys chosen stocks at the market close and sells them at the next open, on Robinhood."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "robin_stocks==3.4.0",
    "pyotp>=2.9",
    "apscheduler>=3.10,<4",
    "exchange_calendars>=4.5",
    "pandas>=2.2",
    "streamlit>=1.40",
    "altair>=5",
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ez-money = "ezmoney.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Series.values returning an ndarray"]
